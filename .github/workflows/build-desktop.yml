name: Build Desktop Binaries

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: windows
            goarch: amd64
            runs-on: windows-latest
            bin_name: torrserver-windows-amd64.exe
            smoke_test: true
          - goos: linux
            goarch: amd64
            runs-on: ubuntu-latest
            bin_name: torrserver-linux-amd64
            smoke_test: true
          - goos: linux
            goarch: arm64
            runs-on: ubuntu-latest
            bin_name: torrserver-linux-arm64
            smoke_test: false
          - goos: darwin
            goarch: amd64
            runs-on: macos-latest
            bin_name: torrserver-darwin-amd64
            smoke_test: false
          - goos: darwin
            goarch: arm64
            runs-on: macos-latest
            bin_name: torrserver-darwin-arm64
            smoke_test: true

    env:
      NODE_OPTIONS: --openssl-legacy-provider

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone upstream TorrServer
        run: |
          git clone --depth 1 https://github.com/YouROK/TorrServer.git upstream_ts

      - name: Install Swag & Generate Web Assets
        shell: bash
        run: |
          cd upstream_ts
          go run gen_web.go
          go install github.com/swaggo/swag/cmd/swag@latest
          cd server
          swag init -g web/server.go --parseDependency --parseInternal --parseDepth 5

      - name: Build Binary (${{ matrix.goos }}/${{ matrix.goarch }})
        shell: bash
        run: |
          mkdir -p dist
          cd upstream_ts/server
          export CGO_ENABLED=0
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          go build -ldflags='-s -w -checklinkname=0' -tags=nosqlite -trimpath -o "${{ github.workspace }}/dist/${{ matrix.bin_name }}" ./cmd

      - name: Smoke Test Binary
        if: matrix.smoke_test == true
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/ts_smoke_data"
          chmod +x "${{ github.workspace }}/dist/${{ matrix.bin_name }}" || true
          echo "Starting smoke test on port 8098..."
          "${{ github.workspace }}/dist/${{ matrix.bin_name }}" -p 8098 -d "${{ runner.temp }}/ts_smoke_data" &
          PID=$!
          echo "Launched TorrServer with PID: $PID"

          # Poll /echo for up to 10 seconds
          SUCCESS=0
          for i in {1..20}; do
            if curl -s -f http://127.0.0.1:8098/echo; then
              echo ""
              echo "TorrServer /echo smoke check passed!"
              SUCCESS=1
              break
            fi
            sleep 0.5
          done

          # Terminate process
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            taskkill.exe //F //IM "${{ matrix.bin_name }}" 2>/dev/null || true
          else
            kill -INT $PID 2>/dev/null || kill -9 $PID 2>/dev/null || true
            wait $PID 2>/dev/null || true
          fi

          if [ $SUCCESS -ne 1 ]; then
            echo "Smoke test failed: TorrServer did not respond on /echo"
            exit 1
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin_name }}
          path: dist/${{ matrix.bin_name }}
          if-no-files-found: error
