name: PR iOS Simulator Verification

on:
  pull_request:
    paths:
      - 'tool/go-shim/**'
      - 'ios/**'
      - 'lib/src/ios_ffi_bindings.dart'
      - 'lib/src/torrserver_controller_ios.dart'
      - '.github/workflows/build-ios.yml'
      - '.github/workflows/test-ios-simulator.yml'

jobs:
  verify-ios:
    name: Verify iOS Build & Simulator
    runs-on: macos-15

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Select Xcode 16.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Prepare TorrServer source
        run: |
          mkdir -p tool/go-shim/torrserver-src
          git clone --depth 1 https://github.com/YouROK/TorrServer.git tool/go-shim/torrserver-src
          cd tool/go-shim/torrserver-src
          export NODE_OPTIONS=--openssl-legacy-provider
          go run gen_web.go

      - name: Build TorrServerKit.xcframework
        run: |
          cd tool/go-shim
          go get -tool golang.org/x/mobile/cmd/gobind
          go mod tidy

          gomobile bind \
            -target=ios/arm64,iossimulator/arm64 \
            -iosversion=14.0 \
            -tags=nosqlite \
            -ldflags="-s -w -checklinkname=0" \
            -trimpath \
            -o "${{ github.workspace }}/ios/TorrServerKit.xcframework" \
            .

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Test Example Pod & Build
        run: |
          cd example
          flutter pub get
          cd ios
          pod install
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
