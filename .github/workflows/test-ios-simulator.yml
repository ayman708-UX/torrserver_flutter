name: PR iOS Simulator Verification

on:
  pull_request:
    paths:
      - 'tool/go-shim/**'
      - 'ios/**'
      - 'lib/src/ios_ffi_bindings.dart'
      - 'lib/src/torrserver_controller_ios.dart'
      - '.github/workflows/build-ios.yml'
      - '.github/workflows/test-ios-simulator.yml'

jobs:
  verify-ios:
    name: Verify iOS Build & Simulator
    runs-on: macos-15

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Select Xcode 16.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Ensure iOS Simulator Runtime Platform is installed
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes
          echo "Downloading iOS Simulator Platform runtime if missing..."
          xcodebuild -downloadPlatform iOS 2>/dev/null || true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Prepare TorrServer source
        run: |
          mkdir -p tool/go-shim/torrserver-src
          git clone --depth 1 https://github.com/YouROK/TorrServer.git tool/go-shim/torrserver-src
          cd tool/go-shim/torrserver-src
          export NODE_OPTIONS=--openssl-legacy-provider
          go run gen_web.go

      - name: Build TorrServerKit.xcframework
        run: |
          cd tool/go-shim
          go get -tool golang.org/x/mobile/cmd/gobind
          go mod tidy

          gomobile bind \
            -target=ios/arm64,iossimulator/arm64,iossimulator/amd64 \
            -iosversion=14.0 \
            -tags=nosqlite \
            -ldflags="-s -w -checklinkname=0" \
            -trimpath \
            -o "${{ github.workspace }}/ios/TorrServerKit.xcframework" \
            .

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch and Place iOS XCFramework
        run: |
          chmod +x tool/ios/fetch_xcframework.sh
          ./tool/ios/fetch_xcframework.sh

      - name: Debug - locate TorrServerKit & inspect XCFramework slices
        run: |
          echo "=== Locating TorrServerKit ==="
          find . -iname "TorrServerKit*" -not -path "*/node_modules/*"
          echo "=== Podspec vendored_frameworks line ==="
          grep -n "vendored_frameworks" ios/torrserver_flutter.podspec || true
          echo "=== Inspecting XCFramework Info.plist & lipo architectures ==="
          XCF=$(find . -iname "TorrServerKit.xcframework" -type d | head -1)
          if [ -n "$XCF" ]; then
            cat "$XCF/Info.plist"
            lipo -info "$XCF"/*/TorrServerKit.framework/TorrServerKit 2>/dev/null || true
          fi

      - name: Build Example iOS App for Simulator
        run: |
          flutter config --no-enable-swift-package-manager
          cd example
          flutter pub get
          cd ios
          pod install --repo-update --verbose
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
