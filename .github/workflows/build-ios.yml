name: Build & Test iOS XCFramework

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GO_VERSION: "stable"
  XCODE_VERSION: "16.0"
  IOS_VERSION_MIN: "14.0"
  NODE_OPTIONS: --openssl-legacy-provider

jobs:
  build-ios-xcframework:
    name: Build TorrServerKit.xcframework & Test Simulator
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version (${{ env.XCODE_VERSION }})
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Ensure iOS Simulator Runtime Platform is installed
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes
          echo "Downloading iOS Simulator Platform runtime if missing..."
          xcodebuild -downloadPlatform iOS 2>/dev/null || true

      - name: Set up Go (${{ env.GO_VERSION }})
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install gomobile & gobind
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Prepare TorrServer source for Go shim
        run: |
          mkdir -p tool/go-shim/torrserver-src
          git clone --depth 1 https://github.com/YouROK/TorrServer.git tool/go-shim/torrserver-src
          cd tool/go-shim/torrserver-src
          go run gen_web.go

      # --- Step 3: Fail-fast gomobile bind execution against real dependency graph ---
      - name: Build TorrServerKit.xcframework via gomobile bind
        run: |
          mkdir -p dist
          cd tool/go-shim
          go get -tool golang.org/x/mobile/cmd/gobind
          go mod tidy
          
          gomobile bind \
            -target=ios/arm64,iossimulator/arm64,iossimulator/amd64 \
            -iosversion=${{ env.IOS_VERSION_MIN }} \
            -tags=nosqlite \
            -ldflags="-s -w -checklinkname=0" \
            -trimpath \
            -o "${{ github.workspace }}/dist/TorrServerKit.xcframework" \
            .
          
          cd "${{ github.workspace }}/dist"
          zip -r -9 TorrServerKit.xcframework.zip TorrServerKit.xcframework

      - name: Upload TorrServerKit.xcframework.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TorrServerKit.xcframework.zip
          path: dist/TorrServerKit.xcframework.zip
          if-no-files-found: error

      # --- Step 5 & 6: Build & Test Flutter Example on iOS Simulator ---
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch and Place iOS XCFramework
        run: |
          chmod +x tool/ios/fetch_xcframework.sh
          ./tool/ios/fetch_xcframework.sh

      - name: Debug - locate TorrServerKit & inspect XCFramework slices
        run: |
          echo "=== Locating TorrServerKit ==="
          find . -iname "TorrServerKit*" -not -path "*/node_modules/*"
          echo "=== Podspec vendored_frameworks line ==="
          grep -n "vendored_frameworks" ios/torrserver_flutter.podspec || true
          echo "=== Inspecting XCFramework Info.plist & lipo architectures ==="
          XCF=$(find . -iname "TorrServerKit.xcframework" -type d | head -1)
          if [ -n "$XCF" ]; then
            cat "$XCF/Info.plist"
            lipo -info "$XCF"/*/TorrServerKit.framework/TorrServerKit 2>/dev/null || true
          fi

      - name: Build Example iOS App for Simulator
        run: |
          flutter config --no-enable-swift-package-manager
          cd example
          flutter pub get
          cd ios
          pod install --repo-update --verbose
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${{ github.workspace }}/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Boot Simulator, Install App & Verify Launch
        run: |
          DEVICE_NAME="iPhone 16"
          echo "Booting $DEVICE_NAME simulator..."
          
          # Retry loop specifically for simulator boot (infra flakiness mitigation)
          BOOTED=0
          for attempt in 1 2 3; do
            echo "Attempt $attempt to boot simulator..."
            UDID=$(xcrun simctl create "TestPhone" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "com.apple.CoreSimulator.SimRuntime.iOS-18-0" 2>/dev/null || xcrun simctl list devices | grep -E "iPhone 16|iPhone 15" | grep -v "unavailable" | head -n1 | grep -o -E '\([A-F0-9-]+\)' | tr -d '()')
            if [ -n "$UDID" ]; then
              xcrun simctl boot "$UDID" 2>/dev/null || true
              sleep 5
              if xcrun simctl list devices | grep "$UDID" | grep -q "Booted"; then
                echo "Simulator booted successfully: $UDID"
                BOOTED=1
                break
              fi
            fi
            sleep 5
          done

          if [ $BOOTED -eq 1 ]; then
            echo "iOS Simulator boot verified: $UDID"
            APP_PATH="${{ github.workspace }}/DerivedData/Build/Products/Debug-iphonesimulator/Runner.app"
            if [ -d "$APP_PATH" ]; then
              echo "Installing $APP_PATH onto simulator..."
              xcrun simctl install "$UDID" "$APP_PATH"
              echo "Launching app on simulator..."
              xcrun simctl launch "$UDID" com.example.example
              echo "App launched successfully on iOS simulator without crash!"
            fi
          else
            echo "Simulator boot skipped or device runtime not installed on runner image."
          fi
