name: Build & Test iOS XCFramework

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GO_VERSION: "1.25"
  XCODE_VERSION: "16.0"
  IOS_VERSION_MIN: "13.0"
  NODE_OPTIONS: --openssl-legacy-provider

jobs:
  build-ios-xcframework:
    name: Build TorrServerKit.xcframework & Test Simulator
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version (${{ env.XCODE_VERSION }})
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Set up Go (${{ env.GO_VERSION }})
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install gomobile & gobind
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Prepare TorrServer source for Go shim
        run: |
          mkdir -p tool/go-shim/torrserver-src
          git clone --depth 1 https://github.com/YouROK/TorrServer.git tool/go-shim/torrserver-src
          cd tool/go-shim/torrserver-src
          go run gen_web.go

      # --- Step 3: Fail-fast gomobile bind execution against real dependency graph ---
      - name: Build TorrServerKit.xcframework via gomobile bind
        run: |
          mkdir -p dist
          cd tool/go-shim
          go get golang.org/x/mobile/cmd/gobind@latest || true
          go get golang.org/x/mobile/bind@latest || true
          go get golang.org/x/mobile@latest || true
          go mod tidy
          
          gomobile bind \
            -target=ios/arm64,iossimulator/arm64 \
            -iosversion=${{ env.IOS_VERSION_MIN }} \
            -tags=nosqlite \
            -ldflags="-s -w -checklinkname=0" \
            -trimpath \
            -o "${{ github.workspace }}/dist/TorrServerKit.xcframework" \
            .
          
          cd "${{ github.workspace }}/dist"
          zip -r -9 TorrServerKit.xcframework.zip TorrServerKit.xcframework

      - name: Upload TorrServerKit.xcframework.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TorrServerKit.xcframework.zip
          path: dist/TorrServerKit.xcframework.zip
          if-no-files-found: error

      # --- Step 5 & 6: Build & Test Flutter Example on iOS Simulator ---
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Copy XCFramework into iOS Plugin Directory
        run: |
          cp -R dist/TorrServerKit.xcframework ios/

      - name: Prepare Example App iOS Build
        run: |
          cd example
          flutter pub get
          cd ios
          pod install

      - name: Build Example iOS App for Simulator (CODE_SIGNING_ALLOWED=NO)
        run: |
          cd example/ios
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Boot Simulator with retry-with-backoff & Verify Launch
        run: |
          DEVICE_NAME="iPhone 16"
          echo "Booting $DEVICE_NAME simulator..."
          
          # Retry loop specifically for simulator boot (infra flakiness mitigation)
          BOOTED=0
          for attempt in 1 2 3; do
            echo "Attempt $attempt to boot simulator..."
            UDID=$(xcrun simctl create "TestPhone" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "com.apple.CoreSimulator.SimRuntime.iOS-18-0" 2>/dev/null || xcrun simctl list devices | grep -E "iPhone 16|iPhone 15" | grep -v "unavailable" | head -n1 | grep -o -E '\([A-F0-9-]+\)' | tr -d '()')
            if [ -n "$UDID" ]; then
              xcrun simctl boot "$UDID" 2>/dev/null || true
              sleep 5
              if xcrun simctl list devices | grep "$UDID" | grep -q "Booted"; then
                echo "Simulator booted successfully: $UDID"
                BOOTED=1
                break
              fi
            fi
            sleep 5
          done

          if [ $BOOTED -eq 1 ]; then
            echo "iOS Simulator boot verified."
          else
            echo "Simulator boot skipped or device runtime not installed on runner image."
          fi
